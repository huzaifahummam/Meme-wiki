<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meme Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#7c3aed;--bg2:#ec4899;--paper:#fffdf5;--ink:#1a1a1a;--yellow:#ffe14d;--blue:#4cc9f0;--pink:#ff5fa2;--hand:#ffffffcc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4c1d95;--bg2:#9d174d;--paper:#2b2140;--ink:#f5eefc}}
:root[data-theme="dark"]{--bg1:#4c1d95;--bg2:#9d174d;--paper:#2b2140;--ink:#f5eefc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Fredoka','Comic Sans MS',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;overflow-x:hidden}
.hand{font-family:'Caveat','Comic Sans MS',cursive}
header{text-align:center;padding:14px 12px 0;color:#fff}
header h1{margin:0;font-size:clamp(26px,5vw,42px);text-shadow:3px 3px 0 #0006}
header p{margin:2px 0 0;font-size:clamp(18px,3vw,24px);color:var(--hand)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
.cover{position:relative;width:min(960px,100%);background-color:#111;background-image:radial-gradient(circle,#ffd84d 0 7px,transparent 8px),radial-gradient(circle,#ffd84d 0 7px,transparent 8px),radial-gradient(circle,#ffd84d 0 7px,transparent 8px),radial-gradient(circle,#ffd84d 0 7px,transparent 8px);background-size:24px 24px;background-repeat:no-repeat;background-position:left top,right top,left bottom,right bottom;padding:22px;border-radius:14px;box-shadow:8px 8px 0 #0007}
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:3px solid #000;border-radius:6px;overflow:hidden;box-shadow:inset 16px 0 14px -12px #0005,inset -16px 0 14px -12px #0005,0 0 0 5px #111}
.book.two::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:76px;margin-left:-38px;pointer-events:none;background:linear-gradient(90deg,transparent,#00000018 25%,#00000050 46%,#000000a0 50%,#00000050 54%,#00000018 75%,transparent)}
.pg{padding:16px;display:grid;grid-template-rows:1fr 1fr;gap:14px;min-height:720px}
.pg+.pg{border-left:0}
.ent{display:flex;gap:10px;align-items:center}
.pol{background:#fff;padding:7px 7px 22px;border:2px solid #111;box-shadow:3px 3px 0 #0006;width:46%;flex:none;transform:rotate(-2deg)}
.ph{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(44px,8vw,76px);background:#ddd;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.note{flex:1;padding:10px;border:2px solid #111;box-shadow:3px 3px 0 #0006;transform:rotate(1.5deg);color:#1a1a1a}
.y{background:var(--yellow)}.b{background:var(--blue)}.p{background:#ffb3d4}
.pol,.note{position:relative}
.pol::before,.note::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fffd 0 10%,transparent 32%),radial-gradient(circle at 50% 50%,var(--pin) 0 60%,#0004 100%),var(--pin);box-shadow:inset -1px -2px 2px #0006,1px 3px 3px #0007,0 0 0 1px #0003;z-index:2}
.note::before{background:radial-gradient(circle at 32% 28%,#fffd 0 10%,transparent 32%),radial-gradient(circle at 50% 50%,var(--pin2) 0 60%,#0004 100%),var(--pin2)}
.view{grid-column:1/-1;padding:24px;min-height:720px}
.view h2{margin:0 0 10px;font-size:28px}
.view p,.view li{font-size:16px;max-width:60ch}
.view input{font:inherit;padding:8px 10px;border:2px solid #111;border-radius:8px;background:#fff;color:#1a1a1a;margin:4px 6px 4px 0}
.view button{font:inherit;border:2px solid #111;border-radius:99px;padding:6px 16px;cursor:pointer;background:var(--yellow);color:#1a1a1a;box-shadow:2px 2px 0 #0007}
.chip{display:inline-block;margin:4px 6px 4px 0;padding:4px 12px;border:2px solid #111;border-radius:99px;background:#fff;color:#1a1a1a}
.view.login{display:grid;place-items:center;text-align:center}
.hide{display:none!important}
.note h3{margin:0 0 4px;font-size:clamp(15px,2.2vw,19px);line-height:1.15;overflow-wrap:anywhere}
.note small{display:block;font-size:12px;opacity:.75;margin-bottom:6px}
.note p{margin:0 0 6px;font-size:14px;overflow-wrap:anywhere}
.rx{display:flex;gap:4px;flex-wrap:wrap}
.rx button{font:inherit;font-size:13px;border:2px solid #111;background:#fff;border-radius:99px;padding:1px 7px;cursor:pointer}
.rx button:hover{background:#fff6a8}
.empty{grid-row:1/3;display:grid;place-items:center;text-align:center;font-size:22px;padding:20px}
.sk{position:fixed;color:var(--hand);font-size:24px;pointer-events:none}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:10px 12px 14px}
nav button,nav input{font:inherit;font-size:15px;border:2px solid #111;border-radius:99px;padding:6px 14px;background:#fff;color:#1a1a1a;cursor:pointer;box-shadow:2px 2px 0 #0007}
nav input{cursor:text;width:150px}
nav button:disabled{opacity:.4;cursor:default}
nav .go{background:var(--yellow)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
dialog{border:3px solid #111;border-radius:12px;background:var(--paper);color:var(--ink);padding:18px;width:min(380px,92vw);box-shadow:6px 6px 0 #0008;font-family:inherit}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 10px}
dialog label{display:block;margin:8px 0 3px;font-size:14px}
dialog input,dialog textarea{width:100%;font:inherit;padding:7px;border:2px solid #111;border-radius:8px;background:#fff;color:#1a1a1a}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.row button{font:inherit;border:2px solid #111;border-radius:99px;padding:6px 16px;cursor:pointer;background:#fff;color:#1a1a1a}
.row .go{background:var(--yellow)}
.msg{color:#c0264f;font-size:13px;min-height:16px}
@media(max-width:700px){.book{grid-template-columns:1fr}.book.two::after{display:none}.pg+.pg{border-left:0;border-top:3px solid #111}.pg{min-height:0}.sk{display:none}}
@media(prefers-reduced-motion:no-preference){.pol,.note{transition:transform .15s}.ent:hover .pol{transform:rotate(0)}.ent:hover .note{transform:rotate(0)}}
nav button,nav input,.rx button,.view button,.row button{transition:box-shadow .2s,background .2s}
nav button:hover,nav button:focus-visible,nav input:hover,nav input:focus{background:#fffbd0;box-shadow:2px 2px 0 #0007,0 0 12px 3px #ffe14d,0 0 30px 8px #ffe14d99}
.view button:hover,.view button:focus-visible,.row button:hover,.row button:focus-visible{background:#fffbd0;box-shadow:2px 2px 0 #0007,0 0 12px 3px #ffe14d,0 0 26px 6px #ffe14d88}
.rx button:hover,.rx button:focus-visible{background:#fffbd0;box-shadow:0 0 8px 2px #ffe14d,0 0 16px 4px #ffe14d88}
nav #prev:disabled:hover,nav #next:disabled:hover{background:#fff;box-shadow:2px 2px 0 #0007}
.turn{position:absolute;inset:0;z-index:4;pointer-events:none;perspective:4200px}
.half{position:absolute;top:0;bottom:0;width:50%;background:var(--paper);overflow:hidden;isolation:isolate}
.half.l{left:0}.half.r{right:0}
.half .pg,.face .pg{height:100%;min-height:0}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d}
.strip{position:absolute;left:0;width:100%;transform-style:preserve-3d;will-change:transform}
.in{position:absolute;top:0;height:100%}
.sg{position:absolute;top:0;height:100%;transform-style:preserve-3d;will-change:transform}
.nxt .strip{transform-origin:left center}
.prv .strip{transform-origin:right center}
.leaf.nxt{left:50%;transform-origin:left center}
.leaf.prv{left:0;transform-origin:right center}
.face{position:absolute;inset:0;background:var(--paper);overflow:hidden;isolation:isolate}
.face.back{transform:rotateY(180deg)}
.sh{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
.cast{position:absolute;top:0;bottom:0;width:50%;opacity:0}
.cast.r,.cast.l{background:rgba(0,0,0,.28);box-shadow:0 0 28px 18px rgba(0,0,0,.3)}
#pick{position:fixed;z-index:60;display:none;flex-direction:column;width:min(350px,92vw);padding:6px;background:#fff;border:2px solid #111;border-radius:12px;box-shadow:4px 4px 0 #0008}
#pick .tabs{display:flex;gap:2px;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:4px}
#pick .tab{flex:1;font-size:18px;padding:3px 0}
#pick .tab.on{background:#ffe14d}
#pick .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;max-height:240px;overflow-y:auto}
#pick button{font-size:22px;line-height:1;border:0;background:transparent;border-radius:8px;padding:5px 7px;cursor:pointer}
#pick button:hover,#pick button:focus-visible{background:#fff6a8;box-shadow:0 0 10px 2px #ffe14d}
.rx .plus{font-weight:700;padding:1px 9px}
.rx button.on{background:#ffe14d}
.auth{width:min(380px,100%);text-align:left;position:relative}
.auth label{display:block;margin:10px 0 2px;font-size:14px}
.auth input{width:100%;margin:0}
.auth .pw{display:flex;gap:6px;align-items:center}.auth .pw button{padding:6px 10px;font-size:13px}
.auth .go{width:100%;margin-top:14px}
.auth .go:disabled{opacity:.5;cursor:wait}
.auth .lnk{background:none!important;border:0!important;box-shadow:none!important;text-decoration:underline;padding:0!important;color:inherit!important;font-size:14px}
.atabs{display:flex;gap:6px;margin-bottom:6px}.atabs button{flex:1;background:#fff!important}.atabs button.on{background:var(--yellow)!important}
.meter{height:6px;border-radius:3px;background:#0002;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.auth small{font-size:12px;opacity:.8}
.msg.ok{color:#168a3a}
.auth hr{border:0;border-top:2px dashed #0004;margin:14px 0}
.note .del{position:absolute;top:3px;right:5px;border:0;background:#fff9;border-radius:99px;font-size:11px;padding:1px 7px;cursor:pointer;color:#1a1a1a;z-index:3}
.note .del:hover{background:#fff}
.notice{position:relative;z-index:5;margin:8px auto 0;width:min(940px,94%);background:#fff3cd;color:#1a1a1a;border:2px solid #111;border-radius:10px;padding:8px 38px 8px 12px;font-size:14px;box-shadow:3px 3px 0 #0006}
.notice button{position:absolute;right:6px;top:5px;border:0;background:none;cursor:pointer;font-size:15px}
.auth .chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}
.auth .chk input{width:18px;height:18px;margin:2px 0 0;padding:0;flex:none}
.dev{border:2px solid #111;border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff;color:#1a1a1a;max-width:560px;font-size:14px}
.dev button{font-size:13px;padding:2px 10px;margin-top:4px}
.caution{position:relative;z-index:5;margin:8px auto 0;width:min(940px,94%);background:#ffe3df;color:#1a1a1a;border:2px solid #b3261e;border-radius:10px;padding:8px 40px 8px 12px;font-size:14px;box-shadow:3px 3px 0 #0006;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.caution button{font:inherit;font-size:13px;border:2px solid #111;border-radius:99px;background:var(--yellow);color:#1a1a1a;padding:2px 12px;cursor:pointer}
.caution button#c_x{position:absolute;right:6px;top:6px;border:0;background:none;padding:0 6px;font-size:15px}
#acct label{display:block;margin:10px 0 2px;font-size:14px}
#acct .pw{display:flex;gap:6px;align-items:center}
.qr{width:180px;height:180px;background:#fff;padding:6px;border:2px solid #111;border-radius:8px;display:block}
.view h3{margin:18px 0 4px}.view code{background:#0001;padding:1px 5px;border-radius:5px;word-break:break-all}
#pen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.book{user-select:none;-webkit-user-select:none}
.view input{user-select:text;-webkit-user-select:text}
.ph img{pointer-events:none}
#rules{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.pg,.view{position:relative;z-index:1}
.book.two::after{z-index:2}
#dots{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
nav #prev,nav #next{transition:box-shadow .2s,background .2s}
nav #prev:hover,nav #next:hover,nav #prev:focus-visible,nav #next:focus-visible{background:#fffbd0;box-shadow:0 0 12px 3px #ffe14d,0 0 30px 8px #ffe14d99}
.note{transition:box-shadow .2s,transform .15s}
.ent:hover .note.y{box-shadow:3px 3px 0 #0006,0 0 24px 7px #ffe14d}
.ent:hover .note.b{box-shadow:3px 3px 0 #0006,0 0 24px 7px #4cc9f0}
.ent:hover .note.p{box-shadow:3px 3px 0 #0006,0 0 24px 7px #ff8fc4}
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<header><h1>Meme Wiki</h1><p class="hand">funny pics, saved forever</p></header>
<div class="sk hand" style="left:2.5%;top:30%;transform:rotate(-8deg)">keep the good ones</div>
<div class="sk hand" style="right:2.5%;bottom:22%;transform:rotate(6deg)">certified goofy</div>
<div id="caution" class="caution hide" role="alert"><span>⚠️ <b>Protect your account.</b> Your account only has a password. Turn on 2-step login (2FA) for enhanced protection.</span><button id="c_on">Turn on 2FA</button><button id="c_x" aria-label="Dismiss">✕</button></div>
<div id="notice" class="notice hide" role="alert"><span id="ntext"></span><button id="nx" aria-label="Dismiss">✕</button></div>
<main><div class="cover"><div class="book" id="book"></div></div></main>
<nav>
<span id="bc" style="display:contents"><button id="prev" aria-label="Previous page">◀</button><span id="pn" style="color:#fff">1 / 1</span><button id="next" aria-label="Next page">▶</button><input id="q" type="search" placeholder="Search memes" aria-label="Search memes"><button class="go" id="add">Add meme</button></span>
<span id="mn" style="display:contents"><button id="home">Home</button><button id="mem">Members</button><button id="lnk">Links</button><button id="abt">About</button><button id="prf">Profile</button><button id="acc">Account</button></span>
<button id="clr">Clear scribbles</button>
<button id="who">Log in</button>
</nav>

<dialog id="dAdd"><h2>Add a meme</h2>
<label for="t">Title</label><input id="t" maxlength="40">
<label for="c">Caption</label><textarea id="c" rows="2" maxlength="120"></textarea>

<div class="msg" id="m1"></div>
<div class="row"><button id="x1">Cancel</button><button class="go" id="ok1">Post meme</button></div></dialog>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js"></script>

function go(v){view=((v==='profile'||v==='account')&&!user)?'login':v;draw()}
function draw(){
 $('bc').classList.toggle('hide',view!=='book');
 $('mn').classList.toggle('hide',view==='login');
 $('who').classList.toggle('hide',view==='login');
 $('book').classList.toggle('two',view==='book');
 $('who').textContent=user?'Log out ('+user+(isAdmin?' · admin':'')+')':'Log in';
 if(view!=='book'){$('book').innerHTML=pageHtml();return}
 var L=list(),tot=Math.max(1,Math.ceil(L.length/4));
 page=Math.min(Math.max(page,0),tot-1);
 var s=L.slice(page*4,page*4+4),h='';
 if(!s.length){h='<div class="pg" style="grid-column:1/-1"><div class="empty">Nothing here yet.<br>Add the first meme.</div></div>'}
 else{h='<div class="pg">'+s.slice(0,2).map(card).join('')+'</div><div class="pg">'+s.slice(2,4).map(card).join('')+'</div>'}
 $('book').innerHTML=h;
 $('pn').textContent=(page+1)+' / '+tot;
 $('prev').disabled=page===0;$('next').disabled=page>=tot-1;
 $('who').textContent=user?'Log out ('+user+(isAdmin?' · admin':'')+')':'Log in';
}

function buildEmoji(){
 var T=[['😀',[[0x1F600,0x1F64F],[0x1F910,0x1F93F],[0x1F970,0x1F97F],[0x1F9D0,0x1F9FF],[0x1F440,0x1F487],[0x1FAE0,0x1FAEF],[0x261D,0x261D],[0x270A,0x270D]]],
 ['🐶',[[0x1F400,0x1F43F],[0x1F980,0x1F9AF],[0x1F300,0x1F344],[0x1F490,0x1F490],[0x1FAB0,0x1FABF]]],
 ['🍕',[[0x1F345,0x1F37F],[0x1F950,0x1F96F],[0x1F9C0,0x1F9CB],[0x1FAD0,0x1FADF]]],
 ['⚽',[[0x1F380,0x1F3FA],[0x1F680,0x1F6FF],[0x1F94A,0x1F94F],[0x26BD,0x26BE],[0x26F3,0x26F5]]],
 ['💡',[]],
 ['❤️',[[0x1F493,0x1F49F],[0x2600,0x27BF],[0x2B00,0x2BFF],[0x1F500,0x1F53D],[0x1F7E0,0x1F7FF],[0x203C,0x25FF],[0x2934,0x2935],[0x3030,0x303D],[0x3297,0x3299]]],
 ['🏁',[]]];
 var G=T.map(function(){return[]}),R=[[0x203C,0x3299],[0x1F000,0x1FAFF]];
 R.forEach(function(rg){for(var cp=rg[0];cp<=rg[1];cp++){
  if(cp>=0x1F1E6&&cp<=0x1F1FF||cp>=0x1F3FB&&cp<=0x1F3FF)continue;
  var ch=String.fromCodePoint(cp);
  if(/\p{Emoji_Presentation}/u.test(ch)){}else if(/\p{Emoji}/u.test(ch)){ch+='\uFE0F'}else continue;
  var t=4;for(var i=0;i<T.length;i++){if(T[i][1].length&&inR(cp,T[i][1])){t=i;break}}
  G[t].push(ch)}});
 G[6]=['🏁','🚩','🏴','🏳️','🏳️‍🌈','🏴‍☠️'].concat('PK IN BD AF IR SA AE TR EG QA KW OM JO LB IQ SY PS MA DZ TN LY SD NG KE ZA GH ET US CA MX BR AR CO CL PE VE GB IE FR DE ES IT PT NL BE CH AT SE NO DK FI PL UA RU GR CZ HU RO CN JP KR TW HK SG MY ID TH VN PH AU NZ'.split(' ').map(function(c){return String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65,0x1F1E6+c.charCodeAt(1)-65)}));
 EMG=G;PK.innerHTML='<div class="tabs">'+T.map(function(t,i){return '<button type="button" class="tab" data-t="'+i+'" aria-label="Emoji group '+(i+1)+'">'+t[0]+'</button>'}).join('')+'</div><div class="grid"></div>'}
function showTab(i){PKT=i;PK.querySelectorAll('.tab').forEach(function(b,j){b.classList.toggle('on',j===i)});var g=PK.querySelector('.grid');g.innerHTML=EMG[i].map(function(e){return '<button type="button" class="em">'+e+'</button>'}).join('');g.scrollTop=0}

PK.onclick=function(e){var t=e.target.closest('.tab');if(t){showTab(+t.dataset.t);return}var b=e.target.closest('.em');if(!b)return;var m=S.find(function(x){return x.id==PKID});if(m&&(!REAL||uid)){var k=b.textContent,l=m.rx[k]||[];if(l.indexOf(REAL?uid:(user||'Guest'))<0)toggleRx(m,k)}PK.style.display='none'};

function flip(dir){var tot=Math.max(1,Math.ceil(list().length/4)),np=page+dir,bk=$('book'),pg=bk.querySelectorAll('.pg');
 if(turning){if(Q.length<8)Q.push(dir);return}
 if(view!=='book'||np<0||np>=tot||pg.length<2||innerWidth<=700||window.matchMedia('(prefers-reduced-motion: reduce)').matches){page=np;draw();return}
 var oL=pg[0].cloneNode(true),oR=pg[1].cloneNode(true);page=np;draw();
 var n2=bk.querySelectorAll('.pg'),nx=dir>0,srcF=nx?oR:oL,srcB=nx?n2[0]:n2[1];

 bk.appendChild(t);turning=true;
 var t0=performance.now();
 function F(a){return Math.min(.6,.55*Math.abs(Math.sin(a*Math.PI/180)))}
 function Hl(a){var m=Math.abs(a);return Math.max(0,1-Math.abs(m-60)/28)*.3+Math.max(0,1-Math.abs(m-120)/28)*.2}
 function gr(h0,h1,f0,f1){return 'linear-gradient(90deg,rgba(255,255,255,'+h0+'),rgba(255,255,255,'+h1+')),linear-gradient(90deg,rgba(0,0,0,'+f0+'),rgba(0,0,0,'+f1+'))'}
 function fr(now){var p=Math.min(1,(now-t0)/D),e=.5-.5*Math.cos(Math.PI*p),th=g*180*e,sn=Math.sin(Math.PI*p),bd=-g*((42*sn+9*Math.sin(2*Math.PI*p))/(N-1)),ph=th,tip=0;
  S.forEach(function(x,i){var a0=th;if(i){ph+=bd;a0=ph;x.sg.style.transform='rotateY('+bd+'deg)'}else x.sg.style.transform='translateZ('+(22*sn)+'px) rotateY('+th+'deg)';
   tip+=w*Math.cos(a0*Math.PI/180);
   var f0=F(a0),f1=F(a0+bd),h0=Hl(a0),h1=Hl(a0+bd),fc=Math.cos(a0*Math.PI/180)>=0;

   x.a.style.opacity=1;x.b.style.opacity=1;
   x.a.style.background=nx?gr(h0,h1,f0,f1):gr(h1,h0,f1,f0);
   x.b.style.background=nx?gr(h1,h0,f1,f0):gr(h0,h1,f0,f1)});
  var tx=(nx?1:-1)*tip;cast.style.left=(W+Math.min(0,tx))+'px';cast.style.width=Math.abs(tx)+'px';cast.style.opacity=sn;
  if(p<1)requestAnimationFrame(fr);else fin()}
 function fin(){if(!t.parentNode)return;t.remove();turning=false;var d=Q.shift();if(d)setTimeout(function(){flip(d)},0)}
 try{fr(t0)}catch(err){fin();return}
 requestAnimationFrame(fr);setTimeout(fin,D+600)}
